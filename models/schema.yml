version: 2

models:
  - name: stg_btc
    columns:
      - name: HASH_KEY
        tests:
          - unique
          - not_null
  - name: stg_btc_outputs
    tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('stg_btc_transactions')
  - name: whale_alert
    latest_version: 2
    config:
      contract:
        enforced: true
    columns:

      - name: output_address
        data_type: string
        data_tests:
          - assert_valid_btc_address
      - name: total_sent
        data_type: float
      - name: tx_count
        data_type: int
      - name: total_sent_usd
        data_type: float

    versions:
      - v: 1
        # Matches what's above
      - v: 2
        # Breaking change: removed total_sent_usd
        columns:
          - include: all
            exclude: [total_sent_usd]




exposures:

  - name: btc_whale_alert
    label: whales in bitcoin transactions
    type: dashboard
    maturity: high
    url: https://datastudio.google.com/reporting/cbc34db8-ffd7-4b6d-acf0-b86606307713
    description: >
      Whales

    depends_on:
      - ref('whale_alert', v=2)
      
    owner:
      name: Jana PG
      email: janapg03@gmail.com
  

