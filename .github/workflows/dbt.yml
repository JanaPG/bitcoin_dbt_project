name: dbt CI

on:
  pull_request:
    branches:
      - master

jobs:
  dbt-run:
    runs-on: ubuntu-latest
    environment: DB_BTC

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.10'

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.9.4 dbt-snowflake==1.9.4


      - name: Set up dbt profile and private key
        env:
          PROFILES_YML: ${{ secrets.PROFILES_YML }}
          DBT_PRIVATE_KEY: ${{ secrets.DBT_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.dbt"
          printf '%s\n' "$PROFILES_YML" > "$HOME/.dbt/profiles.yml"
          printf '%s\n' "$DBT_PRIVATE_KEY" > "$HOME/.dbt/rsa_key.p8"
          chmod 600 "$HOME/.dbt/rsa_key.p8"



      - name: Install dbt deps
        run: dbt deps

      - name: Run dbt debug
        run: dbt debug

      - name: Run dbt
        run: dbt run
